<text x="1480" y="99" fill="#516c73" font-size="23" font-weight="600" font-family="Noto Sans JP,sans-serif" text-anchor="end">右から左へ①→⑤の順。物理時間は進むが、指定した破損の修復だけが止まる。</text>
