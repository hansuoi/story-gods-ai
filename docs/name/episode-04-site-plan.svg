<text x="52" y="61" font-family="Noto Sans JP,sans-serif" font-size="36" font-weight="600" text-anchor="start" fill="#283f46">第4話「閉じる扉」｜旧排水管理室・画面上の位置関係</text>
<text x="53" y="99" font-family="Noto Sans JP,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#687978">本図は漫画内の架空施設の俯瞰作画資料。比例図・実在する消防設備の設計図ではない。</text>
