<!-- visibility occlusion -->
<path d="M420 342L490 342" fill="none" stroke="#354b54" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
<text x="45" y="955" font-family="Noto Sans JP,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#283f46">A→B 6m／B→D 約4m／C→D 約6m。久住の蝶番操作距離8m以内。数字は物語上の目安。</text>
<!-- notes panel -->
<rect x="1085" y="135" width="437" height="780" fill="#fcfcfa" stroke="#91a39f" stroke-width="3"/>
<text x="1109" y="185" font-family="Noto Sans JP,sans-serif" font-size="25" font-weight="600" text-anchor="start" fill="#283f46">第4話で読者に伝える順</text>
<text x="1111" y="243" font-family="Noto Sans JP,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#283f46">① 本来は受付Aで面会</text>
<text x="1111" y="293" font-family="Noto Sans JP,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#283f46">② 事前通知で廊下側へ変更</text>
<text x="1111" y="343" font-family="Noto Sans JP,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#283f46">③ 凪はB付近で音を聞く</text>
<text x="1111" y="393" font-family="Noto Sans JP,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#283f46">④ Dのそばで榊が倒れていた</text>
<path d="M1106 421L1493 421" fill="none" stroke="#a7b6b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="1111" y="471" font-family="Noto Sans JP,sans-serif" font-size="25" font-weight="600" text-anchor="start" fill="#283f46">意図的に未確定のこと</text>
<text x="1110" y="527" font-family="Noto Sans JP,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#283f46">・凪がCの人物を見たか</text>
<text x="1110" y="568" font-family="Noto Sans JP,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#283f46">・榊が変更通知を見たか</text>
<text x="1110" y="609" font-family="Noto Sans JP,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#283f46">・Dの損傷と死因の関係</text>
<text x="1110" y="650" font-family="Noto Sans JP,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#283f46">・誰が導線を変更したか</text>
<path d="M1106 689L1493 689" fill="none" stroke="#a7b6b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="1111" y="738" font-family="Noto Sans JP,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#283f46">実線：固定された施設構造</text>
<text x="1111" y="777" font-family="Noto Sans JP,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#283f46">破線：人物の移動・視線の候補</text>
<text x="1111" y="819" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#283f46">現状では警察保全区画に入らない</text>
<text x="1111" y="859" font-family="Noto Sans JP,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#283f46">後付け仕切りの位置は未確定</text>
</svg>
