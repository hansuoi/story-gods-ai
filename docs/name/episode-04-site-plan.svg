<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1020" viewBox="0 0 1560 1020">
<defs><pattern id="angle" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0L14 14" stroke="#8a9f99" opacity=".2" stroke-width="2"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#486c7a"/></marker></defs>
