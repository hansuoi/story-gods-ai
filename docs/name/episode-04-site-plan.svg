<path d="M635 309L714 429" fill="none" stroke="#b36b67" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/>
<text x="734" y="290" font-family="Noto Sans JP,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#8b5750">C→D 視界6m</text>
