<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
<defs><linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#768389"/><stop offset=".55" stop-color="#485763"/><stop offset="1" stop-color="#202b37"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#f0d4c0"/><stop offset=".6" stop-color="#c59f90"/><stop offset="1" stop-color="#9b756d"/></linearGradient><linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#354451"/><stop offset="1" stop-color="#151f2b"/></linearGradient><pattern id="grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="4" cy="6" r=".7" fill="#fff" opacity=".11"/><circle cx="13" cy="13" r=".7" fill="#121b25" opacity=".12"/></pattern></defs>
<rect width="1024" height="1536" fill="#eeebe3"/><rect x="28" y="28" width="968" height="1480" fill="#fffdf7"/>
