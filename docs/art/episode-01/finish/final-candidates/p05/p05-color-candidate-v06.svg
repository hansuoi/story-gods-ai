<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2100" viewBox="0 0 1400 2100">
<defs>
 <linearGradient id="wall" x2=".9" y2="1"><stop stop-color="#222d37"/><stop offset=".54" stop-color="#56626b"/><stop offset="1" stop-color="#171e28"/></linearGradient>
 <radialGradient id="light" cx=".78" cy=".28" r=".82"><stop stop-color="#f5f4eb" stop-opacity=".54"/><stop offset=".62" stop-color="#a6b0b3" stop-opacity=".08"/><stop offset="1" stop-color="#080c15" stop-opacity=".62"/></radialGradient>
 <linearGradient id="floor" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#6d7678"/><stop offset="1" stop-color="#1a242b"/></linearGradient>
 <linearGradient id="coffin" x1=".05" y1=".1" x2=".85" y2=".9"><stop stop-color="#f6f7f2"/><stop offset=".38" stop-color="#dce4e2"/><stop offset=".73" stop-color="#a7b4b8"/><stop offset="1" stop-color="#eef1ed"/></linearGradient>
 <linearGradient id="coffinSide" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#b3bfc0"/><stop offset="1" stop-color="#525f66"/></linearGradient>
 <linearGradient id="dress" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#1b2630"/><stop offset=".45" stop-color="#0b111a"/><stop offset="1" stop-color="#252d35"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5bcb0"/><stop offset=".48" stop-color="#9b8179"/><stop offset="1" stop-color="#6d5a59"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="grain" width="37" height="41" patternUnits="userSpaceOnUse"><circle cx="2" cy="5" r=".8" fill="#fff" opacity=".11"/><circle cx="22" cy="32" r=".7" fill="#080d12" opacity=".24"/></pattern>
</defs>
