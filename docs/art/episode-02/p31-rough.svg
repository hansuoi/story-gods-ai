oto Sans JP,sans-serif" font-weight="600">2018年の件</text><path d="M76 159L663 159" fill="none" stroke="#adbeb6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="91" y="251" fill="#22343c" font-size="53" font-family="Noto Sans JP,sans-serif" font-weight="600">差出人：三枝凪</text><text x="92" y="335" fill="#22343c" font-size="28" font-family="Noto Sans JP,sans-serif" font-weight="600">見せたいものがあります。</text><text x="92" y="401" fill="#22343c" font-size="26" font-family="Noto Sans JP,sans-serif" font-weight="600">旧管理室で……</text><text x="48" y="687" fill="#22343c" font-size="22" font-family="Noto Sans JP,sans-serif" font-weight="600">安希が知らなかった、呼び出しの始まり。</text></svg></g><text x="35" y="1180" fill="#6b7779" font-size="17" font-family="Noto Sans JP,sans-serif" font-weight="600">神谷家 − 原状回復 −</text><text x="620" y="1180" fill="#6b7779" font-size="17" font-family="Noto Sans JP,sans-serif" font-weight="600">第2話 P31／構図ラフ</text></svg>
