name: Render episode 01 color revisions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/render_episode01_p01_p04.py'
      - 'scripts/render_episode01_color_review_p01_p04.py'
      - 'scripts/render_episode01_p06_v03.py'
      - 'scripts/render_episode01_p07_v04.py'
      - 'scripts/render_episode01_p08_v04.py'
      - 'scripts/render_episode01_p09_p10.py'
      - 'scripts/render_episode01_p11_p12.py'
      - 'scripts/render_episode01_p14_p15.py'
      - 'scripts/render_episode01_p13_p16.py'
      - 'scripts/render_episode01_p17_p18.py'
      - 'scripts/render_episode01_p19_p20.py'
      - 'scripts/render_episode01_p21_p22.py'
      - 'scripts/render_episode01_p23_p24.py'
      - 'scripts/render_episode01_p25_p26.py'
      - 'scripts/render_episode01_p27_p28.py'
      - 'scripts/render_episode01_p29_p32.py'
      - 'scripts/render_episode01_color_review_p25_p32.py'
      - 'scripts/render_episode01_color_review_p17_p24.py'
      - 'scripts/render_episode01_color_review_p09_p15.py'
      - 'scripts/render_episode01_color_review_p09_p16.py'
      - 'docs/art/episode-01/finish/color-candidates/p05.png'
      - 'docs/art/episode-01/finish/color-candidates/p06.png'
      - 'docs/art/episode-01/finish/color-candidates/p07.png'
      - 'docs/art/episode-01/finish/color-candidates/p08.png'
      - 'docs/art/episode-01/finish/color-candidates/sources/p01_p04_rescue_source.png'
      - 'docs/art/episode-01/finish/color-candidates/sources/sakaki_living_smile.png'
      - 'docs/art/episode-01/finish/color-candidates/sources/p08_interview_montage.png'
      - 'docs/art/episode-01/finish/color-candidates/sources/p09_p12_generated_montage.png'
      - 'docs/art/episode-01/finish/color-candidates/sources/p13_p16_generated_montage.png'
      - 'docs/art/episode-01/finish/color-candidates/sources/p17_p20_generated_montage.png'
      - 'docs/art/episode-01/finish/color-candidates/sources/sakaki_living_portrait.png'
      - 'scripts/render_episode01_color_readthrough.py'
      - '.github/workflows/render-episode01-color-revisions.yml'
permissions:
  contents: write
concurrency:
  group: episode01-color-revisions
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image tools and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow numpy
      - name: Validate color renderer Python syntax before expensive rendering
        run: python -m py_compile scripts/render_episode01_*.py
      - name: Recompose P01–P32 from original color assets
        run: |
          python scripts/render_episode01_p01_p04.py
          python scripts/render_episode01_color_review_p01_p04.py
          python scripts/render_episode01_p06_v03.py
          python scripts/render_episode01_p07_v04.py
          python scripts/render_episode01_p08_v04.py
          python scripts/render_episode01_p09_p10.py
          python scripts/render_episode01_p11_p12.py
          python scripts/render_episode01_p14_p15.py
          python scripts/render_episode01_p13_p16.py
          python scripts/render_episode01_p17_p18.py
          python scripts/render_episode01_p19_p20.py
          python scripts/render_episode01_p21_p22.py
          python scripts/render_episode01_p23_p24.py
          python scripts/render_episode01_p25_p26.py
          python scripts/render_episode01_p27_p28.py
          python scripts/render_episode01_p29_p32.py
          python scripts/render_episode01_color_review_p25_p32.py
          python scripts/render_episode01_color_review_p17_p24.py
          python scripts/render_episode01_color_review_p09_p16.py
          python scripts/render_episode01_color_review_p09_p15.py
          python scripts/render_episode01_color_readthrough.py
      - name: Verify output metadata and no edits to originals
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from hashlib import sha256
          from PIL import Image
          folder=Path("docs/art/episode-01/finish/color-candidates")
          manifest=json.loads((folder/"revision-manifest.json").read_text(encoding="utf-8"))
          for target in ("p01_v01.png", "p02_v01.png", "p03_v01.png", "p04_v01.png", "p06_v03.png", "p07_v04.png", "p08_v04.png", "p09_v01.png", "p10_v01.png", "p11_v01.png", "p12_v01.png", "p13_v01.png", "p14_v01.png", "p15_v01.png", "p13_v02.png", "p14_v02.png", "p15_v02.png", "p16_v01.png", "p17_v01.png", "p18_v01.png", "p19_v01.png", "p20_v01.png", "p21_v01.png", "p22_v01.png", "p23_v01.png", "p24_v01.png", "p25_v01.png", "p26_v01.png", "p27_v01.png", "p28_v01.png", "p29_v01.png", "p30_v01.png", "p31_v01.png", "p32_v01.png"):
              data=manifest[target]
              out=folder/target
              assert Image.open(out).size == (1024,1536)
              assert out.stat().st_size == data["bytes"]
              assert sha256(out.read_bytes()).hexdigest() == data["sha256"]
              for name, oldhash in data["source"].items():
                  assert sha256((folder/name).read_bytes()).hexdigest() == oldhash
              print(target, "verified", data["sha256"])
          # P07 v04 must preserve the original speaker panels and exact lettering
          src=Image.open(folder/"p07.png").convert("RGB")
          revised=Image.open(folder/"p07_v04.png").convert("RGB")
          assert src.crop((0,569,1024,1536)).tobytes()==revised.crop((0,569,1024,1536)).tobytes()
          print("P01-P32 color revisions verified; original PNGs retained")
          PY
      - name: Commit revised PNG and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another scheduled run can update binary contact sheets. Never rebase a
          # commit containing a JPG conflict; re-stage our generated outputs on
          # top of the latest remote head instead.
          git fetch origin main
          git reset --mixed origin/main
          git add docs/art/episode-01/finish/color-candidates/p01_v01.png docs/art/episode-01/finish/color-candidates/p02_v01.png docs/art/episode-01/finish/color-candidates/p03_v01.png docs/art/episode-01/finish/color-candidates/p04_v01.png docs/art/episode-01/finish/color-candidates/p06_v03.png docs/art/episode-01/finish/color-candidates/p07_v04.png docs/art/episode-01/finish/color-candidates/p08_v04.png docs/art/episode-01/finish/color-candidates/p09_v01.png docs/art/episode-01/finish/color-candidates/p10_v01.png docs/art/episode-01/finish/color-candidates/p11_v01.png docs/art/episode-01/finish/color-candidates/p12_v01.png docs/art/episode-01/finish/color-candidates/p13_v01.png docs/art/episode-01/finish/color-candidates/p14_v01.png docs/art/episode-01/finish/color-candidates/p15_v01.png docs/art/episode-01/finish/color-candidates/p13_v02.png docs/art/episode-01/finish/color-candidates/p14_v02.png docs/art/episode-01/finish/color-candidates/p15_v02.png docs/art/episode-01/finish/color-candidates/p16_v01.png docs/art/episode-01/finish/color-candidates/p17_v01.png docs/art/episode-01/finish/color-candidates/p18_v01.png docs/art/episode-01/finish/color-candidates/p19_v01.png docs/art/episode-01/finish/color-candidates/p20_v01.png docs/art/episode-01/finish/color-candidates/p21_v01.png docs/art/episode-01/finish/color-candidates/p22_v01.png docs/art/episode-01/finish/color-candidates/p23_v01.png docs/art/episode-01/finish/color-candidates/p24_v01.png docs/art/episode-01/finish/color-candidates/p25_v01.png docs/art/episode-01/finish/color-candidates/p26_v01.png docs/art/episode-01/finish/color-candidates/p27_v01.png docs/art/episode-01/finish/color-candidates/p28_v01.png docs/art/episode-01/finish/color-candidates/p29_v01.png docs/art/episode-01/finish/color-candidates/p30_v01.png docs/art/episode-01/finish/color-candidates/p31_v01.png docs/art/episode-01/finish/color-candidates/p32_v01.png docs/art/episode-01/finish/color-candidates/sources/p19_p20_hinge_photo.png docs/art/episode-01/finish/color-candidates/revision-manifest.json docs/art/episode-01/finish/color-candidates/review_p17_p20.jpg docs/art/episode-01/finish/color-candidates/review_p17_p20.jpg.base64 docs/art/episode-01/finish/color-candidates/review_p21_p24.jpg docs/art/episode-01/finish/color-candidates/review_p21_p24.jpg.base64 docs/art/episode-01/finish/color-candidates/review_p05_p08.jpg docs/art/episode-01/finish/color-candidates/review_p09_p15.jpg docs/art/episode-01/finish/color-candidates/review_p09_p16_current.jpg docs/art/episode-01/finish/color-candidates/review_p01_p04.jpg docs/art/episode-01/finish/color-candidates/review_p01_p04.jpg.base64 docs/art/episode-01/finish/color-candidates/review_p25_p28.jpg docs/art/episode-01/finish/color-candidates/review_p25_p28.jpg.base64 docs/art/episode-01/finish/color-candidates/review_p29_p32.jpg docs/art/episode-01/finish/color-candidates/review_p29_p32.jpg.base64 docs/art/episode-01/finish/color-candidates/review_p25_p32.jpg docs/art/episode-01/finish/color-candidates/review_p25_p32.jpg.base64
          if ! git diff --cached --quiet; then
            git commit -m "art(ep01): render P01-P32 revised color candidates"
            git push origin HEAD:main
          fi
