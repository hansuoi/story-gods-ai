name: Render episode 01 color revisions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/render_episode01_p06_v03.py'
      - '.github/workflows/render-episode01-color-revisions.yml'
permissions:
  contents: write
concurrency:
  group: episode01-color-revisions
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image tools and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow
      - name: Render the revised P06 candidate using existing color originals
        run: python scripts/render_episode01_p06_v03.py
      - name: Verify output metadata and no edits to originals
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from hashlib import sha256
          from PIL import Image
          folder=Path("docs/art/episode-01/finish/color-candidates")
          data=json.loads((folder/"revision-manifest.json").read_text(encoding="utf-8"))["p06_v03.png"]
          out=folder/"p06_v03.png"
          assert Image.open(out).size == (1024,1536)
          assert out.stat().st_size == data["bytes"]
          assert sha256(out.read_bytes()).hexdigest() == data["sha256"]
          for name, oldhash in data["source"].items():
              assert sha256((folder/name).read_bytes()).hexdigest() == oldhash
          print("P06 color revision verified; original PNGs retained")
          PY
      - name: Commit revised PNG and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/art/episode-01/finish/color-candidates/p06_v03.png docs/art/episode-01/finish/color-candidates/revision-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "art(ep01): add recomposed P06 color candidate with exact lettering"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
