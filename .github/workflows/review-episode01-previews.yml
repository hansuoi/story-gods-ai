name: Build episode 01 review previews
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/review-episode01-previews.yml'
      - 'docs/art/episode-01/finish/vector-candidates/*.svg'
permissions:
  contents: write
concurrency:
  group: episode01-review-previews
  cancel-in-progress: false
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts, SVG renderer and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Re-render latest SVG sources for review
        run: |
          python scripts/check_episode01_vectors.py
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          root = Path("docs/art/episode-01/finish/vector-candidates")
          for svg in sorted(root.glob("p[0-9][0-9].svg")):
              cairosvg.svg2png(url=str(svg), write_to=str(svg.with_suffix(".png")))
          PY
      - name: Build eight four-page contact sheets for visual review
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import base64
          import io
          root = Path("docs/art/episode-01/finish/vector-candidates")
          out = root / "review-previews"
          out.mkdir(parents=True, exist_ok=True)
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 24)
          sw, sh, margin, label_h = 450, 675, 22, 44
          for start in range(1, 33, 4):
              sheet = Image.new("RGB", (2 * (sw + margin) + margin, 2 * (sh + label_h + margin) + margin), "#ede9e1")
              draw = ImageDraw.Draw(sheet)
              for n in range(start, start + 4):
                  png = root / f"p{n:02d}.png"
                  assert png.exists(), f"Missing {png}"
                  with Image.open(png) as src:
                      assert src.size == (1024, 1536), (png, src.size)
                      thumb = src.convert("RGB").resize((sw, sh), Image.Resampling.LANCZOS)
                  index = n - start
                  x = margin + (index % 2) * (sw + margin)
                  y = margin + (index // 2) * (sh + label_h + margin)
                  sheet.paste(thumb, (x, y + label_h))
                  draw.text((x, y + 4), f"P{n:02d}", fill="#222a32", font=font)
              bio = io.BytesIO()
              sheet.save(bio, format="JPEG", quality=88, optimize=True, subsampling=0)
              (out / f"sheet{(start-1)//4+1:02d}.jpg").write_bytes(bio.getvalue())
              payload = base64.b64encode(bio.getvalue()).decode("ascii")
              (out / f"sheet{(start-1)//4+1:02d}.jpg.base64").write_text(payload + "\n", encoding="ascii")
              print(f"sheet {(start-1)//4+1:02d}: {len(bio.getvalue())} bytes, pages {start}-{start+3}")
          PY
      - name: Commit review previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/art/episode-01/finish/vector-candidates/review-previews/*.base64 docs/art/episode-01/finish/vector-candidates/review-previews/*.jpg
          # Re-rendered working PNGs are for preview only; keep rebase worktree clean.
          git restore docs/art/episode-01/finish/vector-candidates/p[0-9][0-9].png
          if ! git diff --cached --quiet; then
            git commit -m "art(ep01): add four-page visual QA preview sheets"
            git pull --rebase origin main
            git push
          fi
