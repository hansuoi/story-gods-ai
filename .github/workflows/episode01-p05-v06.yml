name: Episode 01 P05 v06 color illustration

on:
  push:
    paths:
      - 'docs/art/episode-01/finish/final-candidates/p05/p05-color-candidate-v06.svg'
      - 'tools/render_p05_v06.py'
      - '.github/workflows/episode01-p05-v06.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Render original art and independent title layer
        run: |
          python tools/render_p05_v06.py \
            --source docs/art/episode-01/finish/final-candidates/p05/p05-color-candidate-v06.svg \
            --out-dir build/episode01-color/p05-v06
      - name: Check raster dimensions and text separation
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('build/episode01-color/p05-v06')
          a = Image.open(p / 'p05-art-v06.png').convert('RGBA')
          t = Image.open(p / 'p05-title-overlay-v06.png').convert('RGBA')
          c = Image.open(p / 'p05-color-candidate-v06.png').convert('RGB')
          assert a.size == t.size == c.size == (1400, 2100)
          assert t.getbbox() is not None
          assert a.getpixel((150, 150)) != c.getpixel((150, 150))
          print('P05 v06 render structure verified; visual acceptance remains manual')
          PY
      - name: Upload review images
        uses: actions/upload-artifact@v4
        with:
          name: episode01-p05-v06-color-candidate
          path: build/episode01-color/p05-v06/*.png
          if-no-files-found: error
          retention-days: 30
