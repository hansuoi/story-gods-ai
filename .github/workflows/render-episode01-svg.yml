name: Render episode 01 SVG candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/art/episode-01/finish/vector-candidates/*.svg'
      - '.github/workflows/render-episode01-svg.yml'
concurrency:
  group: episode01-svg-render
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install renderer and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check cairosvg
          fc-match 'Noto Sans CJK JP'
      - name: Render SVG sources to PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          import hashlib
          import json
          import struct
          src = Path("docs/art/episode-01/finish/vector-candidates")
          manifest = {}
          for svg in sorted(src.glob("p[0-9][0-9].svg")):
              output = svg.with_suffix(".png")
              cairosvg.svg2png(url=str(svg), write_to=str(output))
              raw = output.read_bytes()
              assert raw[:8] == b"\\x89PNG\\r\\n\\x1a\\n", f"invalid PNG: {output}"
              width, height = struct.unpack(">II", raw[16:24])
              assert (width, height) == (1024, 1536), f"wrong size: {output}: {width}x{height}"
              manifest[output.name] = {"sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw), "width": width, "height": height, "source": svg.name}
              print(f"{svg} -> {output}: {width}x{height}, sha256={manifest[output.name]['sha256']}")
          (src / "render-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2) + "\\n", encoding="utf-8")
          PY
      - name: Commit PNG outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/art/episode-01/finish/vector-candidates/*.png docs/art/episode-01/finish/vector-candidates/render-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "art(ep01): render SVG candidates to PNG"
            git push
          fi
