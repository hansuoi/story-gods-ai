name: Render episode 01 SVG candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/art/episode-01/finish/vector-candidates/*.svg'
      - '.github/workflows/render-episode01-svg.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render SVG sources to PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          src = Path("docs/art/episode-01/finish/vector-candidates")
          for svg in sorted(src.glob("p[0-9][0-9].svg")):
              output = svg.with_suffix(".png")
              cairosvg.svg2png(url=str(svg), write_to=str(output))
              print(f"{svg} -> {output}")
          PY
      - name: Commit PNG outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/art/episode-01/finish/vector-candidates/*.png
          if ! git diff --cached --quiet; then
            git commit -m "art(ep01): render SVG candidates to PNG"
            git push
          fi
